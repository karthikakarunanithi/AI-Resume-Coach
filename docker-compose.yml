services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: coach
      POSTGRES_PASSWORD: coach
      POSTGRES_DB: coach
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coach"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://coach:coach@postgres:5432/coach
      REDIS_URL: redis://redis:6379/0
      MODELS_CONFIG_PATH: /srv/config/models.yaml
      UPLOAD_DIR: /srv/data/uploads
    ports: ["8000:8000"]
    volumes: [uploads:/srv/data/uploads]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

volumes:
  pgdata:
  uploads:
