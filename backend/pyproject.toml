[project]
name = "ai-interview-coach"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "litellm>=1.55",
    "langgraph>=0.2",
    "langfuse>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3",
    "redis>=5.2",
    "fastapi-users[sqlalchemy]>=15.0",
    "python-multipart>=0.0.18",
    "pymupdf>=1.24",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "aiosqlite>=0.20", "ruff>=0.8", "mypy>=1.13",
    "pgserver>=0.1.4",  # embedded Postgres + pgvector for integration tests and scripts/local_db.py
    "tzdata>=2024.1",  # time zone files for that Postgres build, which ships without them
]
embeddings = ["sentence-transformers>=3.0"]
voice = ["faster-whisper>=1.1"]
evals = ["jiwer>=3.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["llm_eval: calls real LLMs; run with RUN_LLM_EVALS=1"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
